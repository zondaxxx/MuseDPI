name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "android/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-ipa:
    name: Unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Validate project files
        run: |
          plutil -lint \
            Example/Sources/ByeByeDPI/Info.plist \
            Example/Sources/ByeByeDPITun/Info.plist \
            Example/Sources/PalkaWidget/Info.plist \
            Example/Sources/ByeByeDPI/ByeByeDPI.entitlements \
            Example/Sources/ByeByeDPITun/ByeByeDPITun.entitlements \
            Example/Sources/PalkaWidget/PalkaWidget.entitlements
          bash -n scripts/build_unsigned_ipa.sh
          swift scripts/validate_strategy_catalog.swift \
            strategy-catalog.json \
            strategy-catalog.json.sig
          xcodebuild -project SwByeDPI.xcodeproj -list

      - name: Build unsigned IPA
        env:
          PALKA_BUNDLE_ID: io.github.zondaxxx.palkadpi
          PALKA_APP_GROUP: group.io.github.zondaxxx.palkadpi
        run: ./scripts/build_unsigned_ipa.sh

      - name: Verify package
        run: |
          unzip -t packages/MuseDPI-unsigned.ipa
          unzip -l packages/MuseDPI-unsigned.ipa | grep -F "Payload/MuseDPI.app/PlugIns/ByeByeDPITun.appex/"
          unzip -l packages/MuseDPI-unsigned.ipa | grep -F "Payload/MuseDPI.app/PlugIns/PalkaWidget.appex/"
          cd packages
          shasum -a 256 MuseDPI-unsigned.ipa > MuseDPI-unsigned.ipa.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuseDPI-${{ github.sha }}
          path: |
            packages/MuseDPI-unsigned.ipa
            packages/MuseDPI-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          title="MuseDPI · iOS $version"
          asset="MuseDPI-$version-unsigned.ipa"
          cp packages/MuseDPI-unsigned.ipa "packages/$asset"
          (cd packages && shasum -a 256 "$asset" > "$asset.sha256")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title"
            gh release upload "$tag" \
              "packages/$asset" \
              "packages/$asset.sha256" \
              --clobber
          else
            gh release create "$tag" \
              "packages/$asset" \
              "packages/$asset.sha256" \
              --title "$title" \
              --generate-notes
          fi
